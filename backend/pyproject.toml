[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerly-backend"
version = "0.1.0"
description = "Ledgerly - Multi-tenant SaaS Accounting Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<0.120.0",
    "uvicorn[standard]>=0.28.0,<0.35.0",
    "pydantic>=2.6.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.28,<2.1.0",
    "asyncpg>=0.29.0,<0.31.0",
    "alembic>=1.13.1,<1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.6,<0.26.0",
    "httpx>=0.27.0,<0.29.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
